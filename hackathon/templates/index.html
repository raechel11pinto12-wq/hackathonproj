<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Civic Grievance Triage</title>
    <!-- Tailwind CSS CDN for quick hackathon styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 min-h-screen p-6 flex flex-col items-center">

    <header class="max-w-3xl w-full mb-8 text-center">
        <h1 class="text-3xl font-bold text-slate-800">Smart Civic Grievance Triage</h1>
        <p class="text-slate-600 mt-2">AI-powered classification and routing for municipal staff</p>
    </header>

    <main class="max-w-3xl w-full grid gap-6">
        <!-- Input Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <label for="complaintInput" class="block text-sm font-semibold text-slate-700 mb-2">
                Citizen Grievance Description
            </label>

            <!-- Quick Scenario Preset Buttons -->
            <div class="flex items-center gap-2 mb-3">
                <span class="text-xs text-slate-500">Presets:</span>
                <button type="button" class="preset-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md transition" data-preset="pothole">
                    Dadar Pothole (Urgent)
                </button>
                <button type="button" class="preset-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md transition" data-preset="garbage">
                    Andheri Garbage (Medium)
                </button>
            </div>

            <textarea 
                id="complaintInput" 
                rows="4" 
                placeholder="Type or paste citizen complaint text here..."
                class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800 resize-none"
            ></textarea>

            <button 
                id="analyzeBtn" 
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2"
            >
                <span id="btnText">Analyze Complaint</span>
            </button>
        </div>

        <!-- Output Cards Section (Hidden by default) -->
        <div id="resultCard" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <span class="text-xs font-bold tracking-wider text-slate-400 uppercase">Analysis Results</span>
                <div class="flex gap-2">
                    <span id="categoryBadge" class="bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full border border-slate-200">
                        Category
                    </span>
                    <span id="priorityBadge" class="text-xs font-bold px-3 py-1 rounded-full border">
                        Priority
                    </span>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Issue Summary</h3>
                <p id="summaryText" class="text-slate-800 font-medium"></p>
            </div>

            <div class="p-4 bg-blue-50 border-l-4 border-blue-600 rounded-r-lg">
                <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Suggested Municipal Action</h4>
                <p id="actionText" class="text-sm text-blue-800"></p>
            </div>
        </div>
    </main>

   <script src="/static/script.js"></script>
</body>
</html>
