<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Civic Grievance Triage</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6 flex flex-col items-center">

    <!-- Header Section -->
    <header class="max-w-2xl w-full mb-6 text-center">
        <h1 class="text-3xl font-bold text-slate-800">Smart Civic Grievance Triage</h1>
        <p class="text-slate-600 mt-2">AI-powered civic complaint classification system</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full flex flex-col gap-6">

        <!-- Input Box Section -->
        <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
            <label for="complaintInput" class="block text-sm font-bold text-slate-700 mb-2">
                Enter Citizen Complaint:
            </label>

            <!-- Preset Buttons for Easy Testing -->
            <div class="flex gap-2 mb-3">
                <span class="text-xs text-slate-500 self-center">Presets:</span>
                <button type="button" onclick="setPreset('pothole')" class="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">
                    Dadar Pothole
                </button>
                <button type="button" onclick="setPreset('garbage')" class="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">
                    Andheri Garbage
                </button>
            </div>

            <!-- Complaint Input Field -->
            <textarea 
                id="complaintInput" 
                rows="4" 
                placeholder="Type complaint here..." 
                class="w-full p-3 border border-slate-300 rounded-lg text-slate-800"
            ></textarea>

            <!-- Submit Button -->
            <button 
                id="submitBtn" 
                onclick="handleAnalyze()" 
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg"
            >
                Analyze Complaint
            </button>
        </div>

        <!-- Result Section (Hidden initially) -->
        <div id="resultCard" class="hidden bg-white p-6 rounded-xl shadow border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <span class="text-sm font-bold text-slate-500">ANALYSIS RESULT</span>
                <div class="flex gap-2">
                    <!-- Category Badge -->
                    <span id="categoryBadge" class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full border">
                        Category
                    </span>
                    <!-- Priority Badge -->
                    <span id="priorityBadge" class="text-xs font-bold px-3 py-1 rounded-full border">
                        Priority
                    </span>
                </div>
            </div>

            <!-- Summary Text -->
            <div>
                <h3 class="text-xs font-bold text-slate-500 uppercase">Summary</h3>
                <p id="summaryText" class="text-slate-800 font-medium mt-1"></p>
            </div>

            <!-- Suggested Action Box -->
            <div class="p-4 bg-blue-50 border-l-4 border-blue-600 rounded">
                <h4 class="text-xs font-bold text-blue-900 uppercase">Suggested Action</h4>
                <p id="actionText" class="text-sm text-blue-800 mt-1"></p>
            </div>
        </div>

    </main>

    <!-- Connect External JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
